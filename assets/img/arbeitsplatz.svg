<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"
     aria-label="Illustration unseres Büros: Schreibtisch am Fenster mit Blick auf einen Schweizer See und die Berge">
  <defs>
    <linearGradient id="wand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E5"/><stop offset="1" stop-color="#EBE0CB"/>
    </linearGradient>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6DCEA"/><stop offset="0.6" stop-color="#E4EDEC"/>
      <stop offset="1" stop-color="#F2E9DA"/>
    </linearGradient>
    <linearGradient id="see" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA9BE"/><stop offset="1" stop-color="#5E8AA2"/>
    </linearGradient>
    <linearGradient id="tisch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CB9E6E"/><stop offset="1" stop-color="#A87C4F"/>
    </linearGradient>
    <!-- Fenster endet oberhalb der Tischgeraete, damit der See frei bleibt -->
    <clipPath id="scheibe"><rect x="162" y="52" width="876" height="266" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="640" fill="url(#wand)"/>

  <!-- ===== Fenster ===== -->
  <rect x="148" y="38" width="904" height="294" rx="20" fill="#3A2C1F"/>
  <g clip-path="url(#scheibe)">
    <rect x="162" y="52" width="876" height="266" fill="url(#himmel)"/>
    <!-- weiche Sonne -->
    <circle cx="792" cy="118" r="38" fill="#F8EBCF" opacity=".8"/>
    <!-- Wolkenschleier -->
    <path d="M240 104h150M300 122h130M700 92h120" stroke="#FFFFFF" stroke-width="7"
          stroke-linecap="round" opacity=".55"/>
    <!-- Berge: hintere Kette hell, vordere dunkler -->
    <path d="M162 232L318 122l96 70 88-58 122 88 92-52 160 84v34H162z" fill="#AEBBBC" opacity=".7"/>
    <path d="M162 250L286 160l92 62 114-40 116 78 104-48 164 72v22H162z" fill="#84959A"/>
    <path d="M286 160l28 20-17 6-22-14z" fill="#F6F8F7" opacity=".9"/>
    <path d="M492 260l-1-1 1 1z" fill="#F6F8F7"/>
    <path d="M608 200l26 18-16 5-21-12z" fill="#F6F8F7" opacity=".85"/>
    <!-- gegenueberliegendes Ufer -->
    <rect x="162" y="266" width="876" height="10" fill="#5F7264" opacity=".6"/>
    <!-- See: von hier bis zur Fensterbank frei sichtbar -->
    <rect x="162" y="276" width="876" height="42" fill="url(#see)"/>
    <!-- Lichtspiegelungen -->
    <path d="M250 288h190M470 300h160M300 310h150M660 290h140M820 306h170M540 312h90"
          stroke="#DCEAF1" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <!-- Segelboot -->
    <path d="M712 276l1-30 24 30z" fill="#FDFAF4"/>
    <path d="M708 276h38l-8 11h-24z" fill="#3A2C1F"/>
  </g>
  <!-- Sprossen -->
  <rect x="594" y="38" width="11" height="294" fill="#3A2C1F"/>
  <rect x="148" y="180" width="904" height="9" fill="#3A2C1F"/>
  <!-- Fensterbank -->
  <rect x="130" y="328" width="940" height="17" rx="6" fill="#DACCB4"/>

  <!-- Pflanze auf der Bank -->
  <path d="M1082 328c2-28 12-48 28-60-6 22-4 42 4 60z" fill="#5E7F5A"/>
  <path d="M1082 328c-18-18-24-42-22-60 13 14 24 34 28 60z" fill="#48684A"/>
  <path d="M1066 328h46l-7 32h-33z" fill="#B5734A"/>

  <!-- ===== Schreibtisch ===== -->
  <rect x="74" y="468" width="1052" height="23" rx="8" fill="url(#tisch)"/>
  <rect x="138" y="491" width="17" height="122" rx="7" fill="#8C6238"/>
  <rect x="1046" y="491" width="17" height="122" rx="7" fill="#8C6238"/>

  <!-- Bildschirm: beginnt auf Höhe der Fensterbank, verdeckt den See nicht -->
  <rect x="404" y="336" width="286" height="124" rx="11" fill="#2C2118"/>
  <rect x="415" y="347" width="264" height="102" rx="6" fill="#FDFAF4"/>
  <rect x="415" y="347" width="264" height="22" rx="6" fill="#EFE6D6"/>
  <circle cx="429" cy="358" r="3.5" fill="#C4B69E"/><circle cx="442" cy="358" r="3.5" fill="#C4B69E"/>
  <rect x="430" y="382" width="132" height="12" rx="6" fill="#3A2C1F"/>
  <rect x="430" y="402" width="200" height="7" rx="3.5" fill="#D6CAB2"/>
  <rect x="430" y="416" width="168" height="7" rx="3.5" fill="#D6CAB2"/>
  <rect x="430" y="430" width="72" height="14" rx="7" fill="#2C2118"/>
  <path d="M523 460h48l10 8h-68z" fill="#2C2118"/>
  <rect x="498" y="460" width="98" height="8" rx="4" fill="#2C2118"/>

  <!-- Laptop, tiefer als der Bildschirm -->
  <path d="M742 386h190l14 74H728z" fill="#2C2118"/>
  <path d="M752 395h170l10 56H741z" fill="#F3ECDD"/>
  <path d="M716 460h232l10 12H706z" fill="#3A2C1F"/>

  <!-- Kaffeetasse -->
  <path d="M250 418h52v30a14 14 0 0 1-14 14h-24a14 14 0 0 1-14-14z" fill="#FDFAF4"/>
  <path d="M302 424h13a10 10 0 0 1 0 20h-13z" fill="none" stroke="#FDFAF4" stroke-width="6"/>
  <ellipse cx="276" cy="418" rx="26" ry="6" fill="#8C6238"/>
  <path d="M267 400c6-8-4-14 2-22M285 400c6-8-4-14 2-22"
        stroke="#C4B69E" stroke-width="3" stroke-linecap="round" fill="none" opacity=".75"/>

  <!-- Notizbuch und Stift -->
  <rect x="176" y="444" width="112" height="21" rx="5" fill="#A87C4F"/>
  <rect x="184" y="440" width="112" height="21" rx="5" fill="#EFE6D6"/>
  <path d="M312 446l56-8 4 12-56 8z" fill="#3A2C1F"/>

  <!-- Stuhllehne -->
  <rect x="516" y="574" width="180" height="66" rx="24" fill="#DCD0BA"/>
</svg>
